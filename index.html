<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ainex GPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/images/favicon-gpt.png" type="image/png"/>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LOADING SCREEN ===================== -->
<!-- Shown the instant the page loads, before we know whether the
     person is signed in. Prevents a flash of the login card for
     users who already have a session. -->
<div class="auth-loading" id="authLoading">
  <img src="logo-white.png" alt="Ainex" class="auth-loading-logo" id="authLoadingLogo">
  <div class="auth-spinner"></div>
</div>

<!-- ===================== AUTH SCREEN ===================== -->
<div class="auth-screen" id="authScreen" style="display:none">
  <div class="auth-card">
    <img src="logo-white.png" alt="Ainex" class="auth-logo" id="authLogo">
    <h1>Welcome to Ainex</h1>
    <p class="auth-sub">Sign in to start chatting.</p>

    <button class="google-btn" id="googleSignInBtn">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.43 3.58v3h3.93c2.3-2.12 3.53-5.24 3.53-8.82z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.93-3c-1.09.73-2.5 1.16-4 1.16-3.08 0-5.69-2.08-6.62-4.87H1.32v3.09C3.29 21.3 7.34 24 12 24z"/>
        <path fill="#FBBC05" d="M5.38 14.38A7.19 7.19 0 0 1 5 12c0-.83.14-1.63.38-2.38V6.53H1.32A11.97 11.97 0 0 0 0 12c0 1.93.46 3.76 1.32 5.47l4.06-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.45-3.45C17.94 1.19 15.24 0 12 0 7.34 0 3.29 2.7 1.32 6.53l4.06 3.09C6.31 6.83 8.92 4.75 12 4.75z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <p class="auth-error" id="authError"></p>
  </div>
</div>

<div class="app" style="display:none">

  <!-- Mobile overlay, closes sidebar when tapped -->
  <div class="overlay" id="overlay"></div>

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <img src="logo-white.png" alt="Ainex" class="brand-mark" id="brandMark">
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>New chat</span>
    </button>

    <nav class="thread-list" id="threadList" aria-label="Conversation history">
      <div class="thread-list-empty" id="threadListEmpty">No conversations yet</div>
    </nav>

    <div class="sidebar-bottom">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb"></span>
        </span>
        <span class="theme-toggle-label" id="themeToggleLabel">Dark mode</span>
      </button>

      <div class="account">
        <div class="account-avatar" id="accountAvatar">?</div>
        <div class="account-meta">
          <div class="account-name" id="accountName">&nbsp;</div>
          <div class="account-plan" id="accountEmail">&nbsp;</div>
        </div>
        <button class="icon-btn" id="logoutBtn" aria-label="Log out" title="Log out">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="sidebarOpen" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title">
        <span id="conversationTitle">New chat</span>
      </div>
      <div class="topbar-spacer"></div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">

        <!-- Empty state shown when there are no messages yet -->
        <div class="empty-state" id="emptyState">
          <img src="logo-white.png" alt="" class="empty-mark" id="emptyMark">
          <h1>What can I help with?</h1>
          <div class="suggestion-grid">
            <button class="suggestion-card" data-prompt="Explain what a race condition is, with a short code example">
              <span class="suggestion-title">Explain a concept</span>
              <span class="suggestion-sub">race conditions, with a code example</span>
            </button>
            <button class="suggestion-card" data-prompt="Write a Python function that flattens a nested list">
              <span class="suggestion-title">Write some code</span>
              <span class="suggestion-sub">flatten a nested list in Python</span>
            </button>
            <button class="suggestion-card" data-prompt="Give me a 3-day itinerary for Osaka, Japan">
              <span class="suggestion-title">Plan a trip</span>
              <span class="suggestion-sub">a 3-day itinerary for Osaka</span>
            </button>
            <button class="suggestion-card" data-prompt="Summarize the plot of a story about a lighthouse keeper">
              <span class="suggestion-title">Brainstorm ideas</span>
              <span class="suggestion-sub">a short story premise</span>
            </button>
          </div>
        </div>

        <!-- Messages get appended here by script.js -->
        <div class="messages" id="messages"></div>

        <!-- Typing indicator, shown while "AI" is responding -->
        <div class="message ai-message typing-row" id="typingRow" hidden>
          <div class="avatar ai-avatar">
            <img src="logo-white.png" alt="" class="avatar-mark" id="typingMark">
          </div>
          <div class="message-body">
            <div class="typing-dots">
              <span></span><span></span><span></span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composerForm">
        <textarea
          id="messageInput"
          class="composer-input"
          placeholder="Message Ainex..."
          rows="1"
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="composer-hint">Ainex can make mistakes. Check important info.</div>
    </div>
  </main>
</div>

<!-- Reusable message templates -->
<template id="userMessageTpl">
  <div class="message user-message">
    <div class="message-body">
      <div class="message-content"></div>
    </div>
  </div>
</template>

<template id="aiMessageTpl">
  <div class="message ai-message">
    <div class="avatar ai-avatar">
      <img src="logo-white.png" alt="" class="avatar-mark">
    </div>
    <div class="message-body">
      <div class="message-content"></div>
      <div class="message-actions">
        <button class="msg-action-btn copy-msg-btn" title="Copy response">
          <svg viewBox="0 0 24 24" width="14" height="14"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
          <span>Copy</span>
        </button>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
